<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Previsão do Tempo</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <input placeholder="Cidade" type="text" class="input-city">
        <button type="button" id="search-button">
            <img class="lupa" src="https://www.svgrepo.com/show/488200/find.svg" alt="">
        </button>
        <div class="caixa-media">

            <h2 class="city">
                Tempos em Rio de Janeiro
            </h2>

            <p class="tempo">28°C</p>

            <p class="description"> <img class="nuvem"
                    src="https://static.vecteezy.com/system/resources/previews/012/595/169/non_2x/realistic-white-cloud-free-png.png"
                    alt="Nuvens Dispersas"> Nuvens Dispersas</p>

            <p class="humidity">Umidade: 70%</p>


        </div>

    </div>
    <script src="./script.js"></script>
</body>

</html>
