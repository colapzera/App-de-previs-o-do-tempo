<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Previsão do Tempo</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <form class="search-box">
            <input placeholder="Buscar cidade" type="text" class="input-city" aria-label="Cidade">
            <button type="submit" id="search-button" aria-label="Buscar">
                <img class="lupa" src="https://www.svgrepo.com/show/488200/find.svg" alt="">
            </button>
        </form>
        <div class="caixa-media">
            <h2 class="city">Rio de Janeiro</h2>
            <span class="weather-icon" aria-hidden="true">☁️</span>
            <p class="tempo">28°C</p>
            <p class="description">Nublado</p>
            <p class="humidity">Umidade: 70%</p>
        </div>
    </div>
    <script src="./script.js"></script>
</body>

</html>
